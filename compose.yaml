x-app: &app
  image: ${APP_IMAGE:-gos-academy-assistant:local}
  pull_policy: never
  env_file:
    - ${APP_ENV_FILE:-.env}
  environment:
    # The entrypoint builds a safely escaped DSN; the host's DATABASE_URL is ignored.
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-gos_academy}
    POSTGRES_USER: ${POSTGRES_USER:-gos}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    MOCK_WEBHOOK_TOKEN: ${MOCK_WEBHOOK_TOKEN:?Set MOCK_WEBHOOK_TOKEN in .env}
    OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:?Set OPERATOR_API_TOKEN in .env}
    EMBEDDING_CACHE_DIR: /opt/models
    EMBEDDING_LOCAL_FILES_ONLY: "true"
    FAQ_OUTPUT_DIR: /app/data/generated/teacher-faq
    KNOWLEDGE_MANIFEST: ${KNOWLEDGE_MANIFEST:-/app/data/samples/docker-manifest.json}
  volumes:
    - generated_data:/app/data/generated
    - staff_credentials:/app/.local
    - ./data/raw:/app/data/raw:ro
  init: true
  restart: unless-stopped
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    db:
      condition: service_healthy
    bootstrap:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gos_academy}
      POSTGRES_USER: ${POSTGRES_USER:-gos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bootstrap:
    <<: *app
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  event-worker:
    <<: *app
    command: ["python", "-m", "scripts.run_event_worker"]

  delivery-worker:
    <<: *app
    command: ["python", "-m", "scripts.run_delivery_worker"]

  teacher-reply-worker:
    <<: *app
    command: ["python", "-m", "scripts.run_teacher_reply_worker"]

  maintenance:
    <<: *app
    command: ["python", "-m", "scripts.run_maintenance_worker"]

volumes:
  postgres_data:
  generated_data:
  staff_credentials:
